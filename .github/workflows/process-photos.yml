name: Process New Photos

# This workflow runs when a PR with new photos is merged to main.
# It processes new JPEG images: converts to WebP, extracts EXIF metadata,
# registers them in gallery JSON, and creates new galleries if needed.
# Each changed gallery gets its own PR to keep push sizes manageable.

on:
  push:
    branches:
      - main
    paths:
      - 'public/images/**/*.jpg'
      - 'public/images/**/*.jpeg'
      - 'public/images/**/*.JPG'
      - 'public/images/**/*.JPEG'

permissions:
  contents: write
  pull-requests: write

jobs:
  detect-galleries:
    runs-on: ubuntu-latest
    outputs:
      galleries: ${{ steps.check-images.outputs.galleries_json }}
      has_images: ${{ steps.check-images.outputs.has_images }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Check for new images
        id: check-images
        run: |
          # Get list of changed files in the last commit
          CHANGED=$(git diff --name-only HEAD~1 HEAD -- 'public/images/**' | grep -iE '\.(jpg|jpeg)$' || true)
          if [ -z "$CHANGED" ]; then
            echo "No new JPEG images found"
            echo "has_images=false" >> $GITHUB_OUTPUT
            echo "galleries_json=[]" >> $GITHUB_OUTPUT
          else
            echo "Found new images:"
            echo "$CHANGED"
            # Store only valid gallery folders (exclude non-gallery image folders).
            # grep -Ev exits 1 on no matches, so || true prevents bash -e from aborting
            # before the has_images=false write below.
            GALLERIES=$(echo "$CHANGED" | sed -n 's|public/images/\([^/]*\)/.*|\1|p' | sort -u | grep -Ev '^(about|blog)$' || true)
            if [ -z "$GALLERIES" ]; then
              echo "No gallery folders changed (only excluded folders like about/blog)"
              echo "has_images=false" >> $GITHUB_OUTPUT
              echo "galleries_json=[]" >> $GITHUB_OUTPUT
            else
              echo "has_images=true" >> $GITHUB_OUTPUT
              # Use -c for compact (single-line) JSON; multi-line values in $GITHUB_OUTPUT
              # require the <<EOF syntax and would break the matrix expression.
              GALLERIES_JSON=$(echo "$GALLERIES" | jq -Rsc '[split("\n") | .[] | select(. != "")]')
              echo "galleries_json=$GALLERIES_JSON" >> $GITHUB_OUTPUT
            fi
          fi

  process-gallery:
    needs: detect-galleries
    if: needs.detect-galleries.outputs.has_images == 'true'
    strategy:
      matrix:
        gallery: ${{ fromJson(needs.detect-galleries.outputs.galleries) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install image processing dependencies
        run: npm install sharp exifr --save-dev

      - name: Process gallery images
        env:
          GALLERY: ${{ matrix.gallery }}
          PUBLIC_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_EMBED_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: node scripts/process-gallery-images.mjs --gallery "$GALLERY" --force

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            WEBP_COUNT=$(git status --porcelain | grep -E '\.webp$' | wc -l || echo 0)
            JSON_COUNT=$(git status --porcelain | grep -E '\.json$' | wc -l || echo 0)
            PAGE_COUNT=$(git status --porcelain | grep -E '\.astro$' | wc -l || echo 0)
            echo "WebP files: $WEBP_COUNT"
            echo "JSON files: $JSON_COUNT"
            echo "Page files: $PAGE_COUNT"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "webp_count=$WEBP_COUNT" >> $GITHUB_OUTPUT
            echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
            echo "page_count=$PAGE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create PR
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONVERT_IMAGES_PAT }}
          GALLERY: ${{ matrix.gallery }}
          BATCH_SIZE: '50'
          PR_TITLE: 'Process new photos: ${{ matrix.gallery }}'
          PR_LABELS: automerge
          PR_BODY: |
            ## Summary
            This PR processes newly added gallery images for **${{ matrix.gallery }}**.

            ## Changes
            - **${{ steps.check-changes.outputs.webp_count }}** WebP images created
            - **${{ steps.check-changes.outputs.json_count }}** gallery JSON files updated
            - **${{ steps.check-changes.outputs.page_count }}** gallery pages created (if new galleries)

            ### What was done:
            - Converted JPEG images to WebP format for faster loading
            - Extracted EXIF metadata (camera, lens, settings, GPS)
            - Registered images in gallery JSON files
            - Created gallery pages for any new gallery folders
            - Performed reverse geocoding for location names (if GPS data available)

            ## Test plan
            - [ ] Verify WebP images load correctly on the site
            - [ ] Verify JPEG fallback works in older browsers
            - [ ] Check that EXIF metadata displays correctly in lightbox
            - [ ] Verify any new gallery pages render correctly
        run: bash scripts/push-gallery-pr.sh "$GALLERY" "auto/process-photos-$GALLERY"
