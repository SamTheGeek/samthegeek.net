name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.any_changed }}
    steps:
      - name: Check for relevant changes
        id: filter
        uses: tj-actions/changed-files@v47
        with:
          files_ignore: |
            .github/workflows/**
            public/images/**
            **/*.webp
            src/content/galleries/**/*.json
            src/content/galleries/**
            scripts/**
            Docs/**
            README.md
            STATUS.md
            AGENTS.md
            AGENT_INSTRUCTIONS.md

  build:
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          filter: blob:none
          sparse-checkout: |
            src
            scripts

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm ci

      - name: Cache Playwright browser binaries
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium browser
        run: npx playwright install chromium

      - name: Create public directory
        run: mkdir -p public

      - name: Build site and run static checks
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run build

      - name: Detect newly added blog posts
        id: blog_changes
        uses: tj-actions/changed-files@v47
        with:
          files: src/content/blog/**

      - name: Run Playwright tests (core)
        run: npm run test:e2e:ci -- --grep-invert "@blog"

      - name: Run Playwright tests (blog content additions)
        if: steps.blog_changes.outputs.any_added == 'true'
        run: npm run test:e2e:ci -- --grep "@blog"

  ci-passed:
    runs-on: ubuntu-latest
    if: always()
    needs: [build]
    steps:
      - name: Check build result
        env:
          BUILD_RESULT: ${{ needs.build.result }}
        run: |
          if [[ "$BUILD_RESULT" == "failure" || "$BUILD_RESULT" == "cancelled" ]]; then
            echo "Build failed or was cancelled"
            exit 1
          fi
          echo "CI passed (build: $BUILD_RESULT)"
