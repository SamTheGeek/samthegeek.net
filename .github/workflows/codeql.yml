name: "CodeQL Advanced"

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      relevant: ${{ steps.filter.outputs.any_changed }}
    steps:
      # changed-files only falls back to the REST API on pull_request events;
      # on push it needs a real git repository to diff against.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none
          fetch-depth: 0
          sparse-checkout: .github

      - name: Check for relevant changes
        id: filter
        uses: tj-actions/changed-files@v47
        with:
          files_ignore: |
            public/images/**
            **/*.webp
            src/content/galleries/**/*.json
            src/content/galleries/**
            scripts/**
            Docs/**
            README.md
            STATUS.md
            AGENTS.md
            AGENT_INSTRUCTIONS.md

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
        - language: actions
          build-mode: none
        - language: javascript-typescript
          build-mode: none
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          filter: blob:none
          sparse-checkout: |
            src
            .github

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Analyze
        uses: github/codeql-action/analyze@v4.37.9
        with:
          category: "/language:${{matrix.language}}"

  codeql-passed:
    runs-on: ubuntu-latest
    if: always()
    needs: [changes, analyze]
    steps:
      - name: Check analyze result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          ANALYZE_RESULT: ${{ needs.analyze.result }}
        run: |
          if [[ "$CHANGES_RESULT" != "success" ]]; then
            echo "Change detection failed or was cancelled (changes: $CHANGES_RESULT)"
            exit 1
          fi
          if [[ "$ANALYZE_RESULT" == "failure" || "$ANALYZE_RESULT" == "cancelled" ]]; then
            echo "CodeQL analysis failed or was cancelled"
            exit 1
          fi
          echo "CodeQL passed (analyze: $ANALYZE_RESULT)"
