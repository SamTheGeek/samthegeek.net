name: Update Photo Metadata

# This workflow refreshes EXIF/location metadata in gallery JSON files without
# touching WebP conversion output. Use this after metadata extraction/display changes.

on:
  workflow_dispatch:
    inputs:
      gallery:
        description: 'Specific gallery to process (leave empty for all)'
        required: false
        default: ''
      skip_geocode:
        description: 'Skip reverse geocoding'
        required: false
        default: 'false'
        type: boolean
  push:
    branches:
      - main
    paths:
      - 'scripts/process-gallery-images.mjs'
      - 'scripts/extract_gallery_exif.py'
      - 'src/components/Lightbox.astro'
      - 'src/content/config.ts'

permissions:
  contents: write
  pull-requests: write

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Refresh photo metadata
        env:
          PUBLIC_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_EMBED_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ARGS="--force --skip-webp"
          if [ -n "${{ inputs.gallery }}" ]; then
            ARGS="$ARGS --gallery ${{ inputs.gallery }}"
          fi
          if [ "${{ inputs.skip_geocode }}" = "true" ]; then
            ARGS="$ARGS --skip-geocode"
          fi
          node scripts/process-gallery-images.mjs $ARGS

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            JSON_COUNT=$(git status --porcelain | grep -E '\.json$' | wc -l || echo 0)
            echo "JSON files: $JSON_COUNT"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check-changes.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          commit-message: 'chore: refresh gallery metadata'
          title: 'chore: Refresh gallery metadata'
          body: |
            ## Summary
            This PR refreshes gallery metadata from photo files.

            ## Changes
            - **${{ steps.check-changes.outputs.json_count }}** gallery JSON files updated

            ### What was done
            - Re-extracted EXIF metadata (camera, lens, settings, GPS)
            - Re-ran reverse geocoding for location names when GPS was available
            - Updated gallery JSON metadata only (no WebP conversion)
          branch: auto/update-photo-metadata
          delete-branch: true
          labels: automerge
