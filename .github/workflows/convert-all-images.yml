name: Process All Gallery Images

# This workflow manually processes all existing gallery images.
# It converts to WebP, extracts EXIF metadata, and registers images in JSON.
# Each gallery gets its own PR to keep push sizes manageable.

on:
  workflow_dispatch:
    inputs:
      quality:
        description: 'WebP quality (1-100)'
        required: false
        default: '100'
      force:
        description: 'Force re-processing of all images'
        required: false
        default: 'true'
        type: boolean
      gallery:
        description: 'Specific gallery to process (leave empty for all)'
        required: false
        default: ''
      skip_webp:
        description: 'Skip WebP conversion (only update metadata)'
        required: false
        default: 'false'
        type: boolean
      skip_geocode:
        description: 'Skip reverse geocoding'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  list-galleries:
    runs-on: ubuntu-latest
    outputs:
      galleries: ${{ steps.list.outputs.galleries_json }}
    steps:
      - name: List galleries
        id: list
        env:
          GH_TOKEN: ${{ github.token }}
          GALLERY_INPUT: ${{ inputs.gallery }}
          REPO: ${{ github.repository }}
        run: |
          if [ -n "$GALLERY_INPUT" ]; then
            GALLERIES_JSON="[\"$GALLERY_INPUT\"]"
          else
            GALLERIES_JSON=$(gh api "repos/$REPO/contents/public/images" \
              --jq '[.[] | select(.type == "dir") | .name | select(. != "about" and . != "blog")]')
          fi
          echo "galleries_json=$GALLERIES_JSON" >> $GITHUB_OUTPUT
          echo "Galleries to process: $GALLERIES_JSON"

  process-gallery:
    needs: list-galleries
    strategy:
      matrix:
        gallery: ${{ fromJson(needs.list-galleries.outputs.galleries) }}
      fail-fast: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install image processing dependencies
        run: npm install sharp exifr --save-dev

      - name: Process gallery images
        env:
          GALLERY: ${{ matrix.gallery }}
          QUALITY: ${{ inputs.quality }}
          FORCE: ${{ inputs.force }}
          SKIP_WEBP: ${{ inputs.skip_webp }}
          SKIP_GEOCODE: ${{ inputs.skip_geocode }}
          PUBLIC_GOOGLE_MAPS_EMBED_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_EMBED_API_KEY }}
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          ARGS="--quality $QUALITY --gallery $GALLERY"
          if [ "$FORCE" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ "$SKIP_WEBP" = "true" ]; then
            ARGS="$ARGS --skip-webp"
          fi
          if [ "$SKIP_GEOCODE" = "true" ]; then
            ARGS="$ARGS --skip-geocode"
          fi
          node scripts/process-gallery-images.mjs $ARGS

      - name: Check for changes
        id: check-changes
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "No changes to commit"
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            WEBP_COUNT=$(git status --porcelain | grep -E '\.webp$' | wc -l || echo 0)
            JSON_COUNT=$(git status --porcelain | grep -E '\.json$' | wc -l || echo 0)
            PAGE_COUNT=$(git status --porcelain | grep -E '\.astro$' | wc -l || echo 0)
            echo "WebP files: $WEBP_COUNT"
            echo "JSON files: $JSON_COUNT"
            echo "Page files: $PAGE_COUNT"
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "webp_count=$WEBP_COUNT" >> $GITHUB_OUTPUT
            echo "json_count=$JSON_COUNT" >> $GITHUB_OUTPUT
            echo "page_count=$PAGE_COUNT" >> $GITHUB_OUTPUT
          fi

      - name: Push changes and create PR
        if: steps.check-changes.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.CONVERT_IMAGES_PAT }}
          GALLERY: ${{ matrix.gallery }}
          RUN_NUMBER: ${{ github.run_number }}
          BATCH_SIZE: '50'
          PR_TITLE: 'Process all photos: ${{ matrix.gallery }}'
          PR_BODY: |
            ## Summary
            This PR processes gallery images for **${{ matrix.gallery }}**.

            **Settings:**
            - Quality: ${{ inputs.quality }}
            - Force re-process: ${{ inputs.force }}
            - Skip WebP: ${{ inputs.skip_webp }}
            - Skip geocode: ${{ inputs.skip_geocode }}

            ## Changes
            - **${{ steps.check-changes.outputs.webp_count }}** WebP images created/updated
            - **${{ steps.check-changes.outputs.json_count }}** gallery JSON files updated
            - **${{ steps.check-changes.outputs.page_count }}** gallery pages created

            ### What was done:
            - Converted JPEG images to WebP format for faster loading
            - Extracted EXIF metadata (camera, lens, settings, GPS)
            - Registered images in gallery JSON files
            - Created gallery pages for any new gallery folders
            - Performed reverse geocoding for location names (if GPS data available)

            ## Test plan
            - [ ] Verify WebP images load correctly on the site
            - [ ] Verify JPEG fallback works in older browsers
            - [ ] Check that EXIF metadata displays correctly in lightbox
            - [ ] Run `npm run build` to verify no build errors
        run: bash scripts/push-gallery-pr.sh "$GALLERY" "auto/process-gallery-$GALLERY-$RUN_NUMBER"
